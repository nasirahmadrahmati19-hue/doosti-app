name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flet jdatetime
      
      - name: Build APK
        run: |
          flet build apk --output build/apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doosti-apk
          path: build/apk/*.apk
          if-no-files-found: error
