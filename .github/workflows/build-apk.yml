name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.26.0

      - name: Install dependencies
        run: |
          pip install jdatetime

      - name: List files (debug)
        run: |
          ls -la
          pwd

      - name: Build APK
        run: |
          flet build apk --module-name main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doosti-App-APK
          path: build/apk/**/*.apk
          if-no-files-found: warn
